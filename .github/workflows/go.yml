name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        ports:
          - 5432:5432
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: newsportal
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - uses: actions/checkout@v3

    - name: Prepare test db
      run: psql -d postgresql://postgres@localhost/newsportal < schema.sql
      working-directory: ./docs/testdb/
      env:
        PGPASSWORD: postgres

    - name: Test
      run: go test -v -tags=integration ./...
      env:
        DB_DSN: postgres://postgres:postgres@localhost:5432/newsportal?sslmode=disable

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'

    - name: Build
      run: go build -v ./...
